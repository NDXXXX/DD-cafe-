[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dd-cafe-api"
version = "0.1.0"
description = "DD Cafe conversational ordering API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.19.1",
  "ddgs>=9.14.4",
  "fastapi>=0.116,<1.0",
  "jieba>=0.42.1,<1.0",
  "langgraph>=1.2.10",
  "langgraph-checkpoint-redis>=0.5.1",
  "openai>=2.53.0",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.10,<3.0",
  "qdrant-client[fastembed]>=1.19.0",
  "rank-bm25>=0.2.2,<1.0",
  "redis>=7.4.1",
  "sqlalchemy>=2.0.51",
  "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.4.0",
  "ragas>=0.4,<0.5",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
